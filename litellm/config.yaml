# LiteLLM proxy — the single egress point for every LLM call (SPEC §5).
#
# n8n's AI Agent node does not emit Langfuse traces from environment variables,
# so all traffic is routed through this proxy and LiteLLM's success/failure
# callbacks write the traces instead. See the SPEC implementation note.
#
# Model names on the left are what n8n asks for; the right-hand side pins the
# provider snapshot. Judge models are pinned to dated or stable releases on
# purpose: a moving alias silently changes the grader between eval runs, which
# would make any run-over-run comparison meaningless.

model_list:
  # --- agent ---------------------------------------------------------------
  - model_name: claude-sonnet-5
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # --- judges (SPEC §9.4: separate model from the agent) -------------------
  - model_name: claude-opus-5
    litellm_params:
      model: anthropic/claude-opus-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: gpt-5.1
    litellm_params:
      model: openai/gpt-5.1-2025-11-13
      api_key: os.environ/OPENAI_API_KEY

  # --- agent fallbacks only (router_settings below) ------------------------
  # Flash, not Pro: this key is on Gemini's free tier, where every Pro model's
  # quota is 0. gemini-2.5-pro, the judge option that used to sit here, is
  # retired for new keys and 404s.
  - model_name: gemini-3.5-flash
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY

litellm_settings:
  # The legacy "langfuse" callback targets the Langfuse v2 ingestion API and is
  # what this stack needs. Verified: image v1.101.0 bundles langfuse SDK 2.59.7,
  # the exact version LiteLLM's docs pin for v2. Langfuse v3/v4 would instead
  # need the `langfuse_otel` callback -- do not switch callbacks without also
  # moving the langfuse service off v2.
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
  # Providers disagree on which sampling params they accept; drop rather than 400.
  drop_params: true

router_settings:
  # The agent's chain: Claude, then GPT, then Gemini. Any error on one model --
  # rate limit, quota, outage, a dropped connection -- moves the call to the next
  # (2026-09-30: two chat runs died on "AnthropicException - Server disconnected"
  # with nowhere to go). Langfuse records which model actually answered.
  #
  # Judges get no fallbacks on purpose. A judge that silently changes vendor
  # mid-run makes its scores incomparable; it should fail instead.
  fallbacks:
    - claude-sonnet-5: ["gpt-5.1", "gemini-3.5-flash"]
  # One quick retry for a blip before moving on; more just delays the fallback.
  num_retries: 1
  # A model that keeps failing is skipped for a minute rather than retried on
  # every call.
  allowed_fails: 2
  cooldown_time: 60

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
