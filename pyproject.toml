[project]
name = "wearable-coach"
version = "0.1.0"
description = "Agent that reads consumer wearable data and gives honest, grounded training guidance."
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
# Garmin Connect pull (SPEC §2 Phase 2). Optional: the loader, the tools server
# and the test suite never import it. Needs Python >=3.12.
api = ["garminconnect>=0.3.15"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["loader", "tools", "evals", "fetcher"]
py-modules = ["db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
